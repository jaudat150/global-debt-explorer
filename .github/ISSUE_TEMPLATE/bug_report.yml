name: Bug report
description: Something in the app or code does not work.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: "What happened and what did you expect?"}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: "Steps to reproduce"}
  - type: input
    id: env
    attributes: {label: OS, Python and Streamlit versions}
  - type: textarea
    id: logs
    attributes: {label: Error message or traceback, render: text}
