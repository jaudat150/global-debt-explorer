name: Publish website (GitHub Pages)

# Builds the static, search-engine-friendly site from data/exports and publishes it.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   APP_URL                   the Streamlit app address, for "explore interactively" links
#   SITE_BASE_URL             a custom domain, e.g. https://debtatlas.org/
#   GOOGLE_SITE_VERIFICATION  the content value from Google Search Console's HTML-tag method
#   PATREON_URL               e.g. https://www.patreon.com/<name> (shown on /support/)
#   CRYPTO_DONATIONS          one "label|address" per line, e.g. "USDT (TRC-20)|T..." (shown on /support/)
on:
  push:
    branches: [main]
    paths: ["data/exports/**", "src/website.py", "src/catalog.py", ".github/workflows/pages.yml"]
  schedule:
    - cron: "10 5 * * 1"   # Mondays, after the weekly data refresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Build site
        run: python -m src.website build --out site
        env:
          APP_URL: ${{ vars.APP_URL }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          PATREON_URL: ${{ vars.PATREON_URL }}
          CRYPTO_DONATIONS: ${{ vars.CRYPTO_DONATIONS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
