name: Refresh World Bank IDS debt data

on:
  schedule:
    # Monthly on day 1 at 04:15 UTC. GitHub may delay scheduled workflows.
    - cron: "15 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-global-bilateral-debt
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The push key lives in this environment, which only the main branch may use.
    environment: data-refresh
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Deploy key with write access; it is on the "protect main" bypass list,
          # so the refreshed data lands on main without a pull request.
          ssh-key: ${{ secrets.DATA_PUSH_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh the IDS creditor-composition cache
        run: python -m src.fetcher
        env:
          LOG_LEVEL: INFO

      - name: Refresh the national country-profile snapshot (Tier 3 safety net)
        # Non-fatal: an API outage must not block the bilateral cache commit.
        run: python -m src.processor profiles || echo "Profile snapshot refresh skipped"
        env:
          LOG_LEVEL: WARNING

      - name: Commit refreshed data to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): refresh World Bank IDS cache and country-profile snapshot"
          file_pattern: data/bilateral_debt_cache.json data/country_profiles_snapshot.json
