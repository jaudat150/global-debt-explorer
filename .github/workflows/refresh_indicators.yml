name: Refresh atlas data snapshot

on:
  schedule:
    # Weekly, Monday 03:40 UTC. World Bank and IMF publish on their own calendars;
    # a weekly pull keeps the offline fallback within days of the live APIs.
    - cron: "40 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-atlas-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Download every atlas indicator
        run: python -m src.indicator_data refresh
      - name: Refresh national debt profiles
        run: python -m src.processor profiles || echo "Profile refresh skipped"
      - name: Publish open-data exports (CSV + datapackage.json)
        run: python -m src.exports build
      - name: Validate exports (coverage, reference figures, consistency)
        run: python -m src.validate --out data/exports/VALIDATION.md
      - name: Open a pull request with the refreshed data
        # main is protected by the "protect main" ruleset, so the bot proposes a PR
        # instead of pushing. A repository admin merges it (bypass) to publish.
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/weekly-snapshot
          delete-branch: true
          commit-message: "chore(data): weekly atlas snapshot and open-data exports"
          title: "chore(data): weekly atlas snapshot and open-data exports"
          body: |
            Automated weekly refresh opened by the "Refresh atlas data snapshot" workflow.
            See data/exports/VALIDATION.md in the diff for coverage and consistency checks.
            Merge to publish; the website rebuilds on the next push to main.
          labels: data
          add-paths: |
            data/indicator_snapshot.json
            data/country_profiles_snapshot.json
            data/exports/*
