name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Unit tests (network-free)
        run: python -m unittest discover -s tests -v
        env:
          GDE_PROFILE_SNAPSHOT: "off"
          GDE_INDICATOR_SNAPSHOT: "off"
      - name: Data-sources doc is up to date
        run: |
          python -m src.catalog --markdown > /tmp/DATA_SOURCES.md
          diff -u docs/DATA_SOURCES.md /tmp/DATA_SOURCES.md
      - name: Python library builds and installs
        run: |
          python -m pip install build
          python -m build --outdir /tmp/dist
          python -m pip install /tmp/dist/*.whl
          python -c "import debt_atlas; print('debt-atlas', debt_atlas.__version__)"
      - name: Website builds from the committed exports
        if: hashFiles('data/exports/latest_values.csv') != ''
        run: python -m src.website build --out /tmp/site
