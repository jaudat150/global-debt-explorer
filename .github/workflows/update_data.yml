name: Refresh World Bank IDS debt data

on:
  schedule:
    # Monthly on day 1 at 04:15 UTC. GitHub may delay scheduled workflows.
    - cron: "15 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-global-bilateral-debt
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh the IDS creditor-composition cache
        run: python -m src.fetcher
        env:
          LOG_LEVEL: INFO

      - name: Refresh the national country-profile snapshot (Tier 3 safety net)
        # Non-fatal: an API outage must not block the bilateral cache commit.
        run: python -m src.processor profiles || echo "Profile snapshot refresh skipped"
        env:
          LOG_LEVEL: WARNING

      - name: Open a pull request with the refreshed data
        # main is protected by the "protect main" ruleset, so the bot proposes a PR
        # instead of pushing. A repository admin merges it (bypass) to publish.
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/ids-refresh
          delete-branch: true
          commit-message: "chore(data): refresh World Bank IDS cache and country-profile snapshot"
          title: "chore(data): monthly World Bank IDS refresh"
          body: |
            Automated monthly refresh of the World Bank IDS creditor cache and the
            country-profile snapshot, opened by the "Refresh World Bank IDS debt data" workflow.
            Merge to publish; the website rebuilds on the next push to main.
          labels: data
          add-paths: |
            data/bilateral_debt_cache.json
            data/country_profiles_snapshot.json
