name: Data issue — wrong, stale or missing number
description: A value looks wrong, out of date, or a country is missing.
labels: [data]
body:
  - type: input
    id: country
    attributes: {label: "Country (name or ISO3)", placeholder: "e.g. Lebanon / LBN"}
    validations: {required: true}
  - type: input
    id: indicator
    attributes: {label: "Indicator", placeholder: "e.g. General government gross debt (% of GDP)"}
    validations: {required: true}
  - type: input
    id: shown
    attributes: {label: "Value and year shown in the app"}
  - type: input
    id: better
    attributes: {label: "Better source (link) and its value/year"}
    validations: {required: true}
  - type: textarea
    id: notes
    attributes: {label: Anything else (definitions, caveats)}
